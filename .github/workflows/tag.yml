name: Tag

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tag

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Tag the commit with the next patch version
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A CI run of an older commit can end after the run of a newer commit.
          if [ "$(git rev-parse origin/main)" != "$SHA" ]; then
            echo "$SHA is not the head of main. The run of the head tags it."
            exit 0
          fi
          if [ -n "$(git tag --points-at "$SHA")" ]; then
            echo "$SHA already has a tag."
            exit 0
          fi
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            next=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" "$SHA" -m "$next"
          git push origin "$next"
          echo "Tagged $SHA as $next."
